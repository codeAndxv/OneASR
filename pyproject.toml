[project]
name = "oneasr"
version = "0.1.0"
description = "Unified speech recognition API integrating multiple ASR engines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "websockets>=15.0.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "faster-whisper>=1.2.1",
    "fireredasr>=0.0.2",
    "silero-vad>=6.0",
    "torchaudio>=2.0",
    "openai>=1.0.0",
    "sherpa-onnx>=1.13.0",
    "numpy>=1.24.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
