# OneASR 模型配置文件

# API Key（所有接口必须携带此 key）
api_key: oneasr-key

# 默认 Provider
default_provider: whisper1

# 模型根目录（取消注释并指定路径可强制使用本地模型）
# model_dir: ./models

# Provider 配置
providers:
  whisper1:
    engine: faster-whisper  # 底层引擎类型
    type: local             # local 或 cloud
    model_name: medium
    device: cpu
    compute_type: int8
    max_duration: null      # 无时长限制
    functions:
      - name: "audioStreamTranscription"
      - name: "fileTranscription"

  mimo:
    engine: mimo
    type: cloud
    model_name: mimo-audio
    api_key:   # 小米 MiMo API Key
    base_url:
    functions:
      - name: "audioStreamTranscription"
      - name: "fileTranscription"

  # X-ASR 流式识别（基于 sherpa-onnx，zipformer2 transducer）
  xasr:
    engine: xasr
    type: local
    model_name: xasr-zh-en
    tokens: models/chunk-160ms-model/tokens.txt
    encoder: models/chunk-160ms-model/encoder-160ms.onnx
    decoder: models/chunk-160ms-model/decoder-160ms.onnx
    joiner: models/chunk-160ms-model/joiner-160ms.onnx
    provider: cpu
    sample_rate: 16000
    feature_dim: 80
    num_threads: 1
    decoding_method: greedy_search
    enable_endpoint_detection: false
    functions:
      - name: "audioStreamTranscription"
