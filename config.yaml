# OneASR 模型配置文件

# API Key（所有接口必须携带此 key）
api_key: oneasr-key

# ASR Provider 配置
ASR-Providers:

  # X-ASR 流式识别（基于 sherpa-onnx，zipformer2 transducer）
  xasr:
    enable: false
    engine: xasr

    # 加载配置
    load:
      model_name: xasr-zh-en
      tokens_path: models/chunk-160ms-model/tokens.txt
      encoder_path: models/chunk-160ms-model/encoder-160ms.onnx
      decoder_path: models/chunk-160ms-model/decoder-160ms.onnx
      joiner_path: models/chunk-160ms-model/joiner-160ms.onnx
      provider: cpu
      sample_rate: 16000
      feature_dim: 80
      num_threads: 1
      decoding_method: greedy_search
      enable_endpoint_detection: false

    # 属性
    properties:
      functions:
        - RealtimeASR
      languages: zh, en

  # Faster-Whisper 文件转录
  faster-whisper:
    enable: false
    engine: faster-whisper

    # 加载配置
    load:
      model_name: medium
      model_path: models/faster-whisper-medium
      device: cpu
      compute_type: int8
      max_duration: null

    # 属性
    properties:
      functions:
        - FileASR
      languages: zh, en, ja, ko, fr, de, es, it, ru, pt, nl, pl, ar, cs, da, fi, el, he, hu, id, ms, no, ro, sk, sv, th, tr, uk, vi, hi

  # Qwen3-ASR 文件转录（基于 qwen_asr，支持 CPU / GPU）
  qwen:
    enable: true
    engine: qwen

    # 加载配置
    load:
      model_name: Qwen/Qwen3-ASR-1.7B
      model_path: models/Qwen3-ASR-1.7B
      device: cpu
      dtype: float32
      max_new_tokens: 256
      max_inference_batch_size: 32
      forced_aligner_name: Qwen/Qwen3-ForcedAligner-0.6B
      forced_aligner_path: models/Qwen3-ForcedAligner-0.6B

    # 属性
    properties:
      functions:
        - FileASR
      languages: zh, en, ja, ko, fr, de, es, it, ru, pt, nl, pl, ar, cs, da, fi, el, he, hu, id, ms, no, ro, sk, sv, th, tr, uk, vi, hi
