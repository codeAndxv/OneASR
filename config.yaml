# OneASR 模型配置文件

# API Key（所有接口必须携带此 key）
api_key: sk-oneasr-v1-p_L3kXm9QZ8sT2vA4wE7rY1u

# 模型生命周期与内存管理配置（Ollama 风格智能加载与释放）
model_manager:
  default_keep_alive: 600        # 默认空闲存活时长（秒，支持 "10m" / 600 / -1 常驻 / 0 用完即焚）
  max_loaded_models: 2           # 最大同时驻留内存的非常驻本地模型数（超出时自动按 LRU 释放空闲模型）
  cleanup_interval: 30           # 后台空闲模型回收巡检间隔（秒）

# ASR Toolkit 全局切片与 VAD 配置（长音频切片、分句与字幕分段参数）
ASR-Toolkit:
  vad:
    model: "silero_vad"          # VAD 模型类型: silero_vad
    threshold: 0.5               # VAD 语音概率置信度阈值 (0.0~1.0)
    min_speech_duration_ms: 250  # 最小语音段时长 (ms)
    min_silence_duration_ms: 300 # 判定为静音的最小停顿时长 (ms)
    padding_ms: 100              # 语音段前后填充缓冲时长 (ms)

  chunking:
    target_chunk_duration: 6.0   # 目标切片/字幕理想时长 (秒，推荐 5.0~6.0s)
    max_chunk_duration: 8.0      # 最大切片时长硬上限 (秒，超过此值强制数学等分，杜绝长字幕)
    min_pause_duration: 0.4      # 触发自然断句的最小静音停顿阈值 (秒)
    min_sentence_duration: 2.0   # 触发停顿断句前切片需达到的最小语义时长 (秒)

  post_process:
    remove_repeats: true         # 是否过滤 ASR 连续重复复读幻觉
    normalize_text: true         # 是否规范化空格与标点

# ─────────────────────────────────────────────────────────────
# 本地模型配置 (local-models)
# Key 为对外暴露的 model_id，由用户/业务自由命名（如 xasr-zh-en, whisper-medium）；
# driver 指定模型系列驱动（xasr, whisper, qwen, funasr 等）；
# 模型文件将自动映射至 data/models/<目录名>，支持 `uv run python -m cli.model pull`。
# ─────────────────────────────────────────────────────────────
local-models:

  # 【实时流式】双语实时听写 (基于 sherpa-onnx, zipformer2 transducer)
  xasr-zh-en:
    enable: true
    driver: xasr
    preload: true                # 实时流式小模型启动即预热
    keep_alive: -1               # -1 表示永驻内存，确保实时语音 0 冷启动延迟

    load:
      model_name: Gilgamesh-J/X-ASR-zh-en
      provider: cpu
      sample_rate: 16000
      feature_dim: 80
      decoding_method: greedy_search
      enable_endpoint_detection: true
      rule1_min_trailing_silence: 2.4
      rule2_min_trailing_silence: 1.2
      rule3_min_utterance_length: 20.0

    capabilities:
      categories:
        - RealtimeASR
      languages: zh, en

  # 【离线文件】Whisper Medium 均衡版 (基于 faster-whisper)
  whisper-medium:
    enable: true
    driver: whisper
    preload: false               # 离线大模型按需加载（启动时仅校验路径）
    keep_alive: 600              # 空闲 10 分钟后自动卸载释放内存

    load:
      model_name: Systran/faster-whisper-medium
      device: cpu
      compute_type: int8
      max_duration: null

    capabilities:
      categories:
        - FileASR
      languages: zh, en, ja, ko, fr, de, es, it, ru, pt, nl, pl, ar, cs, da, fi, el, he, hu, id, ms, no, ro, sk, sv, th, tr, uk, vi, hi

  # 【离线文件】Qwen3-ASR 1.7B (基于 qwen_asr，支持 CPU / GPU)
  qwen3-asr:
    enable: false
    driver: qwen

    load:
      model_name: Qwen/Qwen3-ASR-1.7B
      device: cpu
      dtype: float32
      max_new_tokens: 256
      max_inference_batch_size: 32
      # forced_aligner_name: Qwen/Qwen3-ForcedAligner-0.6B

    capabilities:
      categories:
        - FileASR
      languages: zh, en, ja, ko, fr, de, es, it, ru, pt, nl, pl, ar, cs, da, fi, el, he, hu, id, ms, no, ro, sk, sv, th, tr, uk, vi, hi

  # 【极速文件】阿里 SenseVoice 极速多语言模型 + fsmn-vad (基于 funasr)
  sensevoice-small:
    enable: false
    driver: funasr

    load:
      model_name: iic/SenseVoiceSmall
      vad_model: iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
      punc_model: null
      device: cpu

    capabilities:
      categories:
        - FileASR
      languages: zh, en, yue, ja, ko

# ─────────────────────────────────────────────────────────────
# 云端 / API 服务商配置 (cloud-providers)
# 厂商账号凭据集中配置，一处配置 api_key / base_url 即可激活其下全部模型；
# 云端模型免本地权重下载，不占用本机显存，亦不受 ModelManager 淘汰管辖。
# ─────────────────────────────────────────────────────────────
cloud-providers:

  # 官方 OpenAI 语音服务
  openai-official:
    enable: false
    driver: openai
    connection:
      base_url: "https://api.openai.com/v1"
      api_key: "sk-xxxxxx"
      timeout: 30
      max_retries: 3
    models:
      - id: "whisper-1"
        categories:
          - FileASR
        languages: zh, en, ja, ko, fr, de, es, it, ru

  # Groq 极速推理云 (一 Key 多模型范例)
  groq-cloud:
    enable: false
    driver: openai
    connection:
      base_url: "https://api.groq.com/openai/v1"
      api_key: "gsk_xxxxxx"
      timeout: 15
    models:
      - id: "groq/whisper-large-v3"
        remote_name: "whisper-large-v3"
        categories:
          - FileASR
        languages: zh, en, ja, ko, fr, de, es, it, ru
      - id: "groq/whisper-large-v3-turbo"
        remote_name: "whisper-large-v3-turbo"
        categories:
          - FileASR
        languages: zh, en, ja, ko, fr, de, es, it, ru


# ─────────────────────────────────────────────────────────────
# yt-dlp 视频/音频 URL 解析与下载配置
# ─────────────────────────────────────────────────────────────
yt-dlp:
  enable: true                      # 是否启用 URL 媒体解析与下载功能
  download_dir: "data/downloads"    # 媒体落盘与临时下载目录（支持相对/绝对路径）

  # 媒体格式与分辨率配置
  media:
    # 默认下载类型: "audio" (纯音频，极速省流，ASR推荐) | "video" (音视频合并)
    default_type: "audio"

    # 视频下载配置（当 type="video" 或请求指定 video 时生效）
    video:
      # 目标分辨率上限: "best" | "1080p" | "720p" | "480p" | "360p"
      # 推荐 "720p" 或 "1080p"，兼顾画质与下载速度，避免拉取 4K/8K 撑爆磁盘与带宽
      max_resolution: "720p"
      # 输出视频封装格式: "mp4" (默认，通用性好) | "mkv" | "webm"
      format: "mp4"

    # 音频下载配置（当 type="audio" 或请求指定 audio 时生效）
    audio:
      # 输出音频格式: "best" (保留原始高音质流，如 m4a/opus/aac) | "mp3" | "m4a" | "wav"
      format: "best"
      # 音频质量/比特率: "best" | "192k" | "128k"
      quality: "best"

  # 代理配置（支持智能分流）
  proxy:
    url: ""                         # 代理服务地址，例如: http://127.0.0.1:7890 或 socks5://127.0.0.1:1080 (留空则直连)
    # 仅针对以下平台启用代理（未列出的平台如 bilibili/douyin 自动直连，避免被国内平台拦截或限速）
    platforms:
      - youtube
      - tiktok

  # 身份凭证与 Cookie（解决 B站高画质/高码率限制 & YouTube 机器人验证拦截）
  cookie_file: ""                   # cookies.txt 路径（例如: "cookies.txt"，留空则不使用）

  # 网络超时与分片控制
  socket_timeout: 60                # 网络连接超时时长（秒）
  retries: 5                        # 下载失败重试次数
  concurrent_fragments: 3           # 单任务并发分片下载数

  # 资源与安全限制
  max_filesize_mb: 500              # 最大允许下载的文件大小 (MB，留空/null 为无限制)

  # 外部依赖路径（可选）
  ffmpeg_location: null             # 自定义 ffmpeg 所在路径（留空则自动从系统 PATH 查找）

