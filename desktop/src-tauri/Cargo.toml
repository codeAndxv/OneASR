[package]
name = "oneasr-desktop"
version = "0.1.0"
description = "OneASR Desktop Tray & Companion Application"
authors = ["OneASR Team"]
edition = "2021"

[lib]
name = "oneasr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
