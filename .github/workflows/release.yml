name: Release OneASR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv wheel packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Assemble standalone backend runtime (Python 3.12 + PyTorch MPS)
        run: |
          python3 desktop/scripts/prepare_standalone.py --target-os macos --torch-backend mps

      - name: Package Headless CLI Tarball
        run: |
          cd desktop/src-tauri/resources
          tar -czvf ../../../oneasr-darwin-arm64.tar.gz .
          cd ../../..

      - name: Install desktop npm dependencies
        run: |
          cd desktop
          npm install

      - name: Build frontend assets (Vite)
        run: |
          cd desktop
          npm run build

      - name: Package macOS Desktop Bundle (.dmg)
        run: |
          cd desktop
          npx tauri build
          # Promote generated DMG artifact to workspace root
          cp src-tauri/target/release/bundle/dmg/*.dmg ../OneASR.dmg
          cd ..

      - name: Generate sha256sum.txt
        run: |
          shasum -a 256 OneASR.dmg oneasr-darwin-arm64.tar.gz install.sh > sha256sum.txt
          echo "Generated SHA-256 Checksums:"
          cat sha256sum.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OneASR.dmg
            oneasr-darwin-arm64.tar.gz
            install.sh
            sha256sum.txt
          generate_release_notes: true
