name: Release OneASR

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv wheel packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Assemble standalone backend runtime (Python 3.12 + PyTorch MPS)
        run: |
          python3 desktop/scripts/prepare_standalone.py --target-os macos --torch-backend mps

      - name: Package Headless CLI Tarball
        run: |
          cd desktop/src-tauri/resources
          tar -czvf ../../../oneasr-darwin-arm64.tar.gz .
          cd ../../..

      - name: Install desktop npm dependencies
        run: |
          cd desktop
          npm install

      - name: Build frontend assets (Vite)
        run: |
          cd desktop
          npm run build

      - name: Package macOS Desktop Bundle (.dmg)
        run: |
          cd desktop
          npx tauri build
          # Promote generated DMG artifact to workspace root
          cp src-tauri/target/release/bundle/dmg/*.dmg ../OneASR.dmg
          cd ..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            OneASR.dmg
            oneasr-darwin-arm64.tar.gz

  build-linux-x86_64:
    name: Build Linux (x86_64 Standalone)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv wheel packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Build Linux Universal CUDA Package (GPU / Auto-fallback)
        run: |
          python3 desktop/scripts/prepare_standalone.py \
            --target-os linux \
            --torch-backend cu124 \
            --output-dir dist/oneasr-linux-gpu
          cd dist/oneasr-linux-gpu
          tar -czvf ../../oneasr-linux-x86_64.tar.gz .
          cd ../..

      - name: Build Linux Lightweight CPU-Only Package
        run: |
          python3 desktop/scripts/prepare_standalone.py \
            --target-os linux \
            --torch-backend cpu \
            --output-dir dist/oneasr-linux-cpu
          cd dist/oneasr-linux-cpu
          tar -czvf ../../oneasr-linux-x86_64-cpu.tar.gz .
          cd ../..

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            oneasr-linux-x86_64.tar.gz
            oneasr-linux-x86_64-cpu.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux-x86_64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Copy install.sh and Generate Checksums
        run: |
          cp install.sh release-assets/install.sh
          cd release-assets
          sha256sum * > sha256sum.txt
          echo "Release Assets Checksums:"
          cat sha256sum.txt
          cd ..

      - name: Upload All Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
