name: Release Standalone Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Standalone (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Prepare Standalone Runtime
        run: |
          python3 desktop/scripts/prepare_standalone.py \
            --target-os macos \
            --torch-backend mps

      - name: Build Tauri Desktop Companion
        run: |
          cd desktop
          npm install
          npm run build
          npx tauri build

      - name: Package macOS Artifact
        run: |
          mkdir -p artifacts
          # Locate generated DMG file
          DMG_PATH=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            cp "$DMG_PATH" artifacts/OneASR-macos-arm64.dmg
          else
            echo "Error: DMG file not found!" && exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneASR-macos-arm64.dmg
          path: artifacts/OneASR-macos-arm64.dmg

  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare Standalone Runtime (CUDA 12)
        shell: bash
        run: |
          python desktop/scripts/prepare_standalone.py \
            --target-os windows \
            --torch-backend cu124

      - name: Build Tauri Desktop Companion
        shell: bash
        run: |
          cd desktop
          npm install
          npm run build
          npx tauri build

      - name: Package Windows Artifact
        shell: bash
        run: |
          mkdir -p artifacts
          # Locate generated NSIS Setup executable
          EXE_PATH=$(find desktop/src-tauri/target/release/bundle/nsis -name "*.exe" | head -n 1)
          if [ -n "$EXE_PATH" ]; then
            cp "$EXE_PATH" artifacts/OneASR-windows-x64-setup.exe
          else
            echo "Error: Setup EXE not found!" && exit 1
          fi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneASR-windows-x64-setup.exe
          path: artifacts/OneASR-windows-x64-setup.exe

  build-linux:
    name: Build Linux Standalone (.tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare Standalone Bundle (CUDA 12)
        run: |
          python3 desktop/scripts/prepare_standalone.py \
            --target-os linux \
            --torch-backend cu124 \
            --output-dir dist/oneasr-linux-amd64

      - name: Package Linux Tarball
        run: |
          mkdir -p artifacts
          cd dist
          tar -czf ../artifacts/oneasr-linux-amd64.tar.gz oneasr-linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneasr-linux-amd64.tar.gz
          path: artifacts/oneasr-linux-amd64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
